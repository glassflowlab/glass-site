<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ PRODUCT_NAME }} — 玻璃小店</title>
<meta name="description" content="{{ META_DESC }}">
<meta property="og:title" content="{{ OG_TITLE }}">
<meta property="og:description" content="{{ OG_DESC }}">
<meta property="og:url" content="{{ OG_URL }}">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="site-header">
  <a href="/" class="brand">🍶 玻璃小店</a>
  <nav>
    <a href="/products/">所有瓶款</a>
    <a href="/">首頁</a>
  </nav>
</header>

<main>
<nav class="breadcrumb">
  <a href="/">首頁</a> / <a href="/products/">瓶款</a> / {{ CATEGORY }} / {{ PRODUCT_NAME }}
</nav>

<section class="bottle-hero">
  <div class="bottle-hero-main">
    <div class="bottle-cat-badge">{{ CATEGORY }}</div>
    <h1>{{ PRODUCT_NAME }}</h1>
  </div>
</section>

<section class="bottle-section">
  <h2>📋 規格</h2>
  <ul class="uses">
    {{ SPEC_HTML }}
  </ul>
</section>

<section class="bottle-section">
  <h2>🍯 適合裝什麼？</h2>
  <ul class="uses">
    {{ USES_HTML }}
  </ul>
</section>

<section class="bottle-section">
  <h2>🛒 哪裡買？</h2>
  <div class="cta-block">
    {{ CTA_HTML }}
  </div>
</section>
</main>

<footer class="site-footer">
  <p>🍶 玻璃小店 ・ 玻璃瓶、瓶款建議、手作靈感</p>
</footer>
</body>
</html>
